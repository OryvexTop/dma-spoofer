name: build-ramsploof

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Write driver source
        shell: pwsh
        run: |
          @'
          #include <ntddk.h>
          #include <wdm.h>
          #include <ntstrsafe.h>

          #define SPOOF_SIG 0x52534D42
          #define SYS_FW_TABLE_INFO 76
          #define SPOOFED_SIZE (0x8000 | (128 * 1024 * 1024))

          #pragma pack(push, 1)
          typedef struct _SMBIOS_HDR { UCHAR Type; UCHAR Len; USHORT Handle; } SMBIOS_HDR;
          typedef struct _SMBIOS_T17 {
              SMBIOS_HDR Hdr;
              USHORT PhysArrayHandle;
              USHORT ErrInfoHandle;
              USHORT TotalWidth;
              USHORT DataWidth;
              USHORT Size;
          } SMBIOS_T17;
          #pragma pack(pop)

          typedef NTSTATUS (*PFN_NtQSI)(ULONG, PVOID, ULONG, PULONG);
          static PVOID g_target = NULL;
          static UCHAR g_orig_bytes[14];
          static BOOLEAN g_hooked = FALSE;

          #pragma pack(push,1)
          typedef struct _TRAMP { UCHAR code[14]; UCHAR jmp_back[14]; } TRAMP;
          #pragma pack(pop)
          static TRAMP g_tramp;

          static VOID wp_off(VOID){ ULONG_PTR c=__readcr0(); __writecr0(c & ~0x10000); }
          static VOID wp_on (VOID){ ULONG_PTR c=__readcr0(); __writecr0(c |  0x10000); }

          static VOID patch_bytes(PVOID dst, PVOID src, SIZE_T n){
              wp_off();
              RtlCopyMemory(dst, src, n);
              wp_on();
          }

          static VOID build_tramp(PVOID target){
              RtlCopyMemory(g_tramp.code, target, 14);
              g_tramp.jmp_back[0]=0xFF; g_tramp.jmp_back[1]=0x25;
              *(ULONG*)&g_tramp.jmp_back[2]=0;
              *(PVOID*)&g_tramp.jmp_back[6]=(PUCHAR)target+14;
          }

          static NTSTATUS HookNtQSI(ULONG cls, PVOID info, ULONG len, PULONG ret){
              NTSTATUS st = ((PFN_NtQSI)&g_tramp.code)(cls, info, len, ret);
              if (!NT_SUCCESS(st)) return st;
              if (cls != SYS_FW_TABLE_INFO) return st;
              if (len < 12) return st;

              PULONG sig = (PULONG)info;
              if (*sig != SPOOF_SIG) return st;

              PUCHAR buf = (PUCHAR)info + 12;
              ULONG  blen = len - 12, off = 0;
              while (off + 4 < blen){
                  SMBIOS_HDR* h = (SMBIOS_HDR*)(buf+off);
                  if (h->Type == 127) break;
                  if (h->Type == 17 && h->Len >= 0x14){
                      ((SMBIOS_T17*)h)->Size = (USHORT)SPOOFED_SIZE;
                  }
                  off += h->Len;
                  while (off+1 < blen && !(buf[off]==0 && buf[off+1]==0)) off++;
                  off += 2;
              }
              return st;
          }

          static PVOID find_ntqsi(VOID){
              UNICODE_STRING n; RtlInitUnicodeString(&n, L"NtQuerySystemInformation");
              return MmGetSystemRoutineAddress(&n);
          }

          static VOID install_hook(VOID){
              g_target = find_ntqsi();
              if (!g_target) return;
              RtlCopyMemory(g_orig_bytes, g_target, 14);
              build_tramp(g_target);
              UCHAR jmp[14] = {0x48,0xB8};
              *(PVOID*)&jmp[2]=HookNtQSI;
              jmp[10]=0xFF; jmp[11]=0xE0; jmp[12]=0x90; jmp[13]=0x90;
              patch_bytes(g_target, jmp, 14);
              g_hooked = TRUE;
          }

          static VOID remove_hook(VOID){
              if (g_hooked && g_target) patch_bytes(g_target, g_orig_bytes, 14);
              g_hooked = FALSE;
          }

          VOID Unload(PDRIVER_OBJECT d){ UNREFERENCED_PARAMETER(d); remove_hook(); DbgPrint("[ramsploof] unloaded\n"); }

          NTSTATUS DriverEntry(PDRIVER_OBJECT d, PUNICODE_STRING r){
              UNREFERENCED_PARAMETER(r);
              d->DriverUnload = Unload;
              install_hook();
              DbgPrint("[ramsploof] hooked\n");
              return STATUS_SUCCESS;
          }
          '@ | Set-Content -Path ramsploof.c -Encoding ASCII

      - name: Write vcxproj
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project DefaultTargets="Build" ToolsVersion="17.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations">
              <ProjectConfiguration Include="Release|x64">
                <Configuration>Release</Configuration>
                <Platform>x64</Platform>
              </ProjectConfiguration>
            </ItemGroup>
            <PropertyGroup Label="Globals">
              <ProjectGuid>{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}</ProjectGuid>
              <RootNamespace>ramsploof</RootNamespace>
              <WindowsTargetPlatformVersion>10.0.22621.0</WindowsTargetPlatformVersion>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />
            <PropertyGroup Label="Configuration">
              <ConfigurationType>DynamicLibrary</ConfigurationType>
              <PlatformToolset>v143</PlatformToolset>
              <CharacterSet>Unicode</CharacterSet>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>_AMD64_;AMD64;DBG=0;NDEBUG;POOL_NX_OPTIN=1;_KERNEL_MODE;%(PreprocessorDefinitions)</PreprocessorDefinitions>
                <AdditionalIncludeDirectories>$(WindowsSdkDir)Include\$(WindowsTargetPlatformVersion)\km;$(WindowsSdkDir)Include\$(WindowsTargetPlatformVersion)\km\crt;$(WindowsSdkDir)Include\$(WindowsTargetPlatformVersion)\shared;$(WindowsSdkDir)Include\$(WindowsTargetPlatformVersion)\ucrt;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
                <RuntimeLibrary>MultiThreaded</RuntimeLibrary>
                <BufferSecurityCheck>false</BufferSecurityCheck>
                <ExceptionHandling>false</ExceptionHandling>
                <BasicRuntimeChecks>Default</BasicRuntimeChecks>
                <WarningLevel>Level3</WarningLevel>
                <TreatWarningAsError>false</TreatWarningAsError>
                <Optimization>MaxSpeed</Optimization>
                <DisableSpecificWarnings>4100;4189;4201;4214;4244;4267;4324;4742;%(DisableSpecificWarnings)</DisableSpecificWarnings>
              </ClCompile>
              <Link>
                <SubSystem>Native</SubSystem>
                <EntryPointSymbol>DriverEntry</EntryPointSymbol>
                <AdditionalDependencies>ntoskrnl.lib;hal.lib;ntstrsafe.lib;BufferOverflowK.lib;wdmsec.lib;wmilib.lib;%(AdditionalDependencies)</AdditionalDependencies>
                <AdditionalLibraryDirectories>$(WindowsSdkDir)Lib\$(WindowsTargetPlatformVersion)\km\x64;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
                <GenerateDebugInformation>true</GenerateDebugInformation>
                <OptimizeReferences>true</OptimizeReferences>
                <EnableCOMDATFolding>true</EnableCOMDATFolding>
                <SetChecksum>true</SetChecksum>
                <RandomizedBaseAddress>false</RandomizedBaseAddress>
                <DataExecutionPrevention>true</DataExecutionPrevention>
                <ImportLibrary>$(OutDir)ramsploof.lib</ImportLibrary>
                <TargetMachine>MachineX64</TargetMachine>
              </Link>
              <PostBuildEvent>
                <Command>copy /Y "$(TargetPath)" "$(TargetDir)ramsploof.sys"</Command>
              </PostBuildEvent>
            </ItemDefinitionGroup>
            <ItemGroup>
              <ClCompile Include="ramsploof.c" />
            </ItemGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          '@ | Set-Content -Path ramsploof.vcxproj -Encoding UTF8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build driver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild ramsploof.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Generate test cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=ramsploof-test" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          Export-Certificate -Cert $cert -FilePath testcert.cer | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath testcert.pfx `
            -Password (ConvertTo-SecureString "test" -AsPlainText -Force) | Out-Null

      - name: Sign driver
        shell: cmd
        run: |
          signtool sign /fd SHA256 /f testcert.pfx /p test /tr http://timestamp.digicert.com /td SHA256 /v x64\Release\ramsploof.sys

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ramsploof-build
          path: |
            x64/Release/ramsploof.sys
            x64/Release/ramsploof.dll
            testcert.cer
            testcert.pfx
