name: Build dma-spoofer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download MemProcFS and Extract DLLs
        shell: pwsh
        run: |
          Write-Host "::group::Fetching latest MemProcFS release"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ufrisk/MemProcFS/releases/latest" -Headers @{ "User-Agent" = "GitHub-Actions" }
          $asset = $release.assets | Where-Object { $_.name -like "*win_x64*.zip" -or $_.name -like "*win*.zip" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Select-Object -First 1
          }
          Write-Host "Downloading: $($asset.name) from $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "memprocfs.zip" -UserAgent "GitHub-Actions"
          Write-Host "::endgroup::"

          Write-Host "::group::Extracting Archive"
          Expand-Archive -Path "memprocfs.zip" -DestinationPath "memprocfs_extracted" -Force
          Write-Host "::endgroup::"

          Write-Host "::group::Copying all required DLLs"
          New-Item -ItemType Directory -Force -Path "dlls" | Out-Null

          # FTD3XX.dll and FTD3XXWU.dll are included in the MemProcFS release
          $dllsToFind = @("vmm.dll", "leechcore.dll", "vmmyara.dll", "FTD3XX.dll", "FTD3XXWU.dll")
          foreach ($dll in $dllsToFind) {
            $found = Get-ChildItem -Path "memprocfs_extracted" -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName -Destination "dlls\" -Force
              Write-Host "Copied: $dll"
            } else {
              Write-Host "::warning::Could not find $dll in MemProcFS archive"
            }
          }
          
          Get-ChildItem -Path "dlls" | Select-Object Name, Length
          Write-Host "::endgroup::"

      - name: Build release
        run: cargo build --release --verbose

      - name: Copy DLLs to build output
        shell: pwsh
        run: |
          if (Test-Path "dlls") {
            Write-Host "Copying DLLs to target\release\"
            Copy-Item -Path "dlls\*" -Destination "target\release\" -Force
          } else {
            Write-Host "::warning::No dlls folder found"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dma-spoofer-windows
          path: |
            target/release/dma-spoofer.exe
            target/release/*.dll
          if-no-files-found: error
          retention-days: 30
