name: Build dma-spoofer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download MemProcFS (latest)
        shell: pwsh
        run: |
          Write-Host "::group::Fetching latest MemProcFS release"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ufrisk/MemProcFS/releases/latest" -Headers @{ "User-Agent" = "GitHub-Actions" }
          $asset = $release.assets | Where-Object { $_.name -like "*win_x64*.zip" -or $_.name -like "*win*.zip" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Select-Object -First 1
          }
          Write-Host "Downloading: $($asset.name) from $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "memprocfs.zip" -UserAgent "GitHub-Actions"
          Write-Host "::endgroup::"

          Write-Host "::group::Extracting MemProcFS"
          Expand-Archive -Path "memprocfs.zip" -DestinationPath "memprocfs_extracted" -Force
          Get-ChildItem -Path "memprocfs_extracted" -Recurse -Filter "*.dll" | Select-Object FullName
          Write-Host "::endgroup::"

          Write-Host "::group::Copying DLLs"
          New-Item -ItemType Directory -Force -Path "dlls" | Out-Null

          $dllsToFind = @("vmm.dll", "leechcore.dll", "vmmyara.dll")
          foreach ($dll in $dllsToFind) {
            $found = Get-ChildItem -Path "memprocfs_extracted" -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName -Destination "dlls\" -Force
              Write-Host "Copied: $dll"
            } else {
              Write-Host "::warning::Could not find $dll in MemProcFS archive"
            }
          }
          Get-ChildItem -Path "dlls" | Select-Object Name, Length
          Write-Host "::endgroup::"

      - name: Download FTDI D3XX drivers
        shell: pwsh
        run: |
          Write-Host "::group::Downloading FTDI D3XX driver"
          $headers = @{
            "User-Agent"      = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            "Accept"          = "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
            "Accept-Language" = "en-US,en;q=0.5"
          }
          $session = [Microsoft.PowerShell.Commands.WebRequestSession]::new()
          $ftdiUrl = "https://www.ftdichip.com/Drivers/D3XX/FTD3XXDriver_WHQLCertified_v1.3.0.10.zip"
          
          try {
            Invoke-WebRequest -Uri $ftdiUrl -OutFile "ftdi_d3xx.zip" -WebSession $session -Headers $headers -UseBasicParsing
            Write-Host "Downloaded FTDI D3XX driver"
          } catch {
            Write-Host "::warning::Failed to download FTDI D3XX from primary URL: $_"
            Write-Host "Trying alternative mirror URL..."
            $altUrl = "https://github.com/OryvexTop/dma-spoofer/raw/refs/heads/main/dependencies/FTD3XXDriver_WHQLCertified_v1.3.0.10.zip"
            if (-not (Test-Path "ftdi_d3xx.zip")) {
              Invoke-WebRequest -Uri $altUrl -OutFile "ftdi_d3xx.zip" -Headers @{ "User-Agent" = "GitHub-Actions" }
            }
          }
          Write-Host "::endgroup::"

          Write-Host "::group::Extracting FTDI D3XX"
          Expand-Archive -Path "ftdi_d3xx.zip" -DestinationPath "ftdi_extracted" -Force
          Get-ChildItem -Path "ftdi_extracted" -Recurse -Filter "*.dll" | Select-Object FullName
          Write-Host "::endgroup::"

          Write-Host "::group::Copying FTDI DLLs"
          $ftd3xx = Get-ChildItem -Path "ftdi_extracted" -Recurse -Filter "FTD3XX.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ftd3xx) {
            Copy-Item $ftd3xx.FullName -Destination "dlls\" -Force
            Write-Host "Copied: FTD3XX.dll"
          } else {
            Write-Host "::warning::FTD3XX.dll not found in archive"
          }

          $ftd3xxwu = Get-ChildItem -Path "ftdi_extracted" -Recurse -Filter "FTD3XXWU.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ftd3xxwu) {
            Copy-Item $ftd3xxwu.FullName -Destination "dlls\" -Force
            Write-Host "Copied: FTD3XXWU.dll"
          } else {
            Write-Host "::warning::FTD3XXWU.dll not found (optional)"
          }
          Write-Host "::endgroup::"

      - name: Build release
        run: cargo build --release --verbose

      - name: Copy DLLs to build output
        shell: pwsh
        run: |
          if (Test-Path "dlls") {
            Write-Host "Copying DLLs to target\release\"
            Copy-Item -Path "dlls\*" -Destination "target\release\" -Force
          } else {
            Write-Host "::warning::No dlls folder found"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dma-spoofer-windows
          path: |
            target/release/dma-spoofer.exe
            target/release/*.dll
          if-no-files-found: error
          retention-days: 30
