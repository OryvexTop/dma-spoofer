name: Build dma-spoofer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --verbose

      - name: Show what was built
        run: |
          Get-ChildItem -Path "target\release" -Filter "*.exe"
          Get-ChildItem -Path "target\release" -Filter "*.dll"

      - name: Copy DLLs if they exist
        run: |
          if (Test-Path "dlls") {
            Write-Host "Found dlls folder, copying..."
            Copy-Item -Path "dlls\*" -Destination "target\release\" -Force
            Get-ChildItem -Path "target\release" -Filter "*.dll"
          } else {
            Write-Host "::warning::dlls folder not found - skipping DLL copy. The exe will need DLLs added manually."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dma-spoofer-windows
          path: |
            target/release/dma-spoofer.exe
            target/release/*.dll
          if-no-files-found: warn
          retention-days: 30
